[project]
name = "pitwall-agent"
version = "0.1.0"
description = "An AI-powered Formula 1 racing assistant based on LangGraph and RAG."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.138.2",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "langgraph>=1.2.7",
    "openai>=1.99.1",
    "pgvector>=0.4.1",
    "pydantic-settings>=2.11.0",
    "pypdf>=4.3.1",
    "psycopg[binary]>=3.2.10",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.49.0",
    "redis>=8.0.1",
    "alembic>=1.18.5",
    "prometheus-client>=0.26.0",
    "pymupdf>=1.28.0",
    "mcp>=1.9,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "unit: fast isolated tests without infrastructure",
    "integration: API and repository boundary tests",
    "eval: deterministic Agent and RAG quality regressions",
    "infrastructure: tests requiring PostgreSQL and Redis",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pyright]
include = ["app", "scripts"]
exclude = [
    ".venv",
    "frontend",
]
