services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pitwall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitwall
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pitwall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitwall-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pitwall:pitwall@postgres:5432/pitwall
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REGULATION_VECTOR_RETRIEVAL_ENABLED: ${REGULATION_VECTOR_RETRIEVAL_ENABLED:-false}
      REGULATION_RERANK_ENABLED: ${REGULATION_RERANK_ENABLED:-false}
      MEMORY_VECTOR_RETRIEVAL_ENABLED: ${MEMORY_VECTOR_RETRIEVAL_ENABLED:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      TRANSFORMERS_CACHE: /models/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
    volumes:
      - ${HF_MODELS_DIR:-./.hf-models}:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    container_name: pitwall-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
