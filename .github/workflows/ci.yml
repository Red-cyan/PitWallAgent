name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --dev
      - name: Unit and integration tests with coverage
        run: uv run pytest -m "unit or integration" --cov --cov-report=term-missing --cov-report=xml
      - name: Eval regression tests
        run: uv run pytest -m eval
      - name: Agent quality gate
        run: uv run python scripts/run_agent_eval.py
      - name: RAG quality gate
        run: >-
          uv run python scripts/run_rag_eval.py
          --mode keyword
          --min-section-recall-at-5 0.98
          --min-clause-recall-at-5 0.95
          --min-mrr 0.75
          --min-rejection-rate 1.0
      - name: QA answer quality gate (offline deterministic)
        run: >-
          uv run python scripts/run_qa_eval.py
          --mode offline
          --min-status-accuracy 0.95
          --min-citation-consistency 1.0

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet

  backend-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pitwall
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: pitwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitwall -d pitwall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pitwall:pitwall@localhost:5432/pitwall
      REDIS_URL: redis://localhost:6379/0
      SESSION_BACKEND: redis
      RUN_INFRA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --dev
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: PostgreSQL and Redis integration tests
        run: uv run pytest -m infrastructure

  hybrid-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pitwall
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: pitwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitwall -d pitwall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pitwall:pitwall@localhost:5432/pitwall
      REGULATION_VECTOR_RETRIEVAL_ENABLED: "true"
      REGULATION_RERANK_ENABLED: "true"
      REGULATION_EMBEDDING_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --dev
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Build and activate BGE corpus
        run: >-
          uv run python scripts/build_regulation_chunks.py
          --corpus-version ci-${{ github.sha }}
          --activate
      - name: Vector retrieval quality gate
        run: >-
          uv run python scripts/run_rag_eval.py
          --mode vector
          --min-recall-at-5 0.6
          --min-mrr 0.45
          --min-rejection-rate 1.0
      - name: Hybrid quality gate with model rerank
        run: >-
          uv run python scripts/run_rag_eval.py
          --mode hybrid
          --min-section-recall-at-5 0.98
          --min-clause-recall-at-5 0.975
          --min-mrr 0.75
          --min-rejection-rate 1.0

  qa-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --dev
      - name: End-to-end answer quality gate with LLM judge
        run: >-
          uv run python scripts/run_qa_eval.py
          --mode online
          --min-status-accuracy 0.95
          --min-citation-consistency 1.0
          --min-groundedness-score 4.0
          --min-helpfulness-score 3.5
          --min-rejection-correct 0.85
          --json-output docs/evals/qa-online.json
          --markdown-output docs/evals/qa-online.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
